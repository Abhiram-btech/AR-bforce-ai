# BForce AI - Step 1: fake login app (sensor + bouncer) and CrowdSec (detector)
# Start:  docker compose up -d --build
# Stop:   docker compose down

services:
  login-app:
    build: ./login-app
    container_name: login-app
    environment:
      TEST_MODE: "1"                      # lets simulators fake IPs via X-Sim-IP. NEVER use in production.
      CROWDSEC_URL: http://crowdsec:8080
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY}
      LOG_PATH: /logs/auth.log
    volumes:
      - logs:/logs
    ports:
      - "127.0.0.1:5000:5000"             # only reachable from inside the Codespace / via port forwarding
    restart: unless-stopped

  crowdsec:
    build:
      context: ./vendor/crowdsec          # our own copy of CrowdSec v1.7.0 (git submodule), built with its own Dockerfile
      args:
        BUILD_VERSION: v1.7.0
    image: bforce/crowdsec:v1.7.0
    container_name: crowdsec
    depends_on:
      - login-app                         # login app creates auth.log first
    environment:
      BOUNCER_KEY_loginapp: ${CROWDSEC_BOUNCER_KEY}   # registers the login app as a bouncer
      DISABLE_ONLINE_API: "true"                      # keep test data local; no registration with CrowdSec's online API
      NO_HUB_UPGRADE: "true"                          # entrypoint: skip "cscli hub upgrade" on startup
    volumes:
      - logs:/logs:ro
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./crowdsec/parsers/bforce-raw.yaml:/etc/crowdsec/parsers/s00-raw/bforce-raw.yaml:ro    # passes plain lines to s01
      - ./crowdsec/parsers/bforce-logs.yaml:/etc/crowdsec/parsers/s01-parse/bforce-logs.yaml:ro
      - ./crowdsec/scenarios/login-bf.yaml:/etc/crowdsec/scenarios/bforce-login-bf.yaml:ro
      - ./crowdsec/scenarios/login-spray.yaml:/etc/crowdsec/scenarios/bforce-login-spray.yaml:ro
      - ./crowdsec/scenarios/login-slow.yaml:/etc/crowdsec/scenarios/bforce-login-slow.yaml:ro
      - ./crowdsec/config.yaml.local:/etc/crowdsec/config.yaml.local:ro   # fixed hub branch + hub downloads disabled
      # No volume on /etc/crowdsec: the entrypoint runs "cscli hub update" whenever the hub
      # index lives in a volume. The config is re-created from the image on each container create.
      - crowdsec-data:/var/lib/crowdsec/data
    restart: unless-stopped

volumes:
  logs:
  crowdsec-data:
